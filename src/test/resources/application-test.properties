spring.application.name=saitring-employee-manager-test

# H2 In-Memory Database for Fast Isolated Testing
spring.datasource.url=jdbc:h2:mem:sematest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Disable flyway for H2 create-drop integration tests
spring.flyway.enabled=false

# Redis
spring.data.redis.url=redis://localhost:6379

# App Properties
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LXRlc3Qtc2VjcmV0LWtleS0xMjM0NTY3ODkwMTI=
app.jwt.expiration-seconds=3600

app.brevo.api-key=
app.brevo.sender-email=test@saitring.com
app.brevo.sender-name=Test Security

app.twilio.account-sid=
app.twilio.auth-token=
app.twilio.from-number=

app.supabase.url=
app.supabase.key=
app.supabase.bucket=test-logos
