
spring.config.import=optional:file:.env[.properties]

spring.application.name=${APP_NAME:saitring-employee-manager}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.url=${UPSTASH_REDIS_URL}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-NO_TRACE}] [%X{ownerId:-ANON}] %-5level %logger{36} - %msg%n
logging.level.dev.sonu.saitring_employee_manager=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:86400}

app.brevo.api-key=${BREVO_API_KEY}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:sema.servicesupport@gmail.com}
app.brevo.sender-name=${BREVO_SENDER_NAME:Saitring Security}
app.brevo.sms-sender=${BREVO_SMS_SENDER:SAITRING}

app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}

app.supabase.url=${SUPABASE_URL:https://phquzmzdfdfbvosexgct.supabase.co}
app.supabase.key=${SUPABASE_KEY:}
app.supabase.bucket=${SUPABASE_BUCKET:organization-logos}

app.storage.s3.bucket=${S3_BUCKET:sema-31}
app.storage.s3.region=${AWS_REGION:eu-north-1}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
