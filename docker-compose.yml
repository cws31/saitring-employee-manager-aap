services:
  mysql:
    image: mysql:8.0
    container_name: sema-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: saitring_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: sema_user
      MYSQL_PASSWORD: sema_password
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone='+00:00'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sema-network

  redis:
    image: redis:7-alpine
    container_name: sema-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sema-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sema-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/saitring_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: sema_user
      DB_PASSWORD: sema_password
      UPSTASH_REDIS_URL: redis://redis:6379
      APP_JWT_SECRET: c2FpdHJpbmctZW1wbG95ZWUtbWFuYWdlci1zZWNyZXQta2V5LTI1Ni1iaXRzLWVuY3J5cHRpb24=
      APP_JWT_EXPIRATION_SECONDS: 86400
    ports:
      - "8080:8080"
    networks:
      - sema-network

volumes:
  mysql_data:
  redis_data:

networks:
  sema-network:
    driver: bridge
